<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="minymaton logo">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- queued messages -->
  <g stroke="#92400e" stroke-width="3" stroke-linejoin="round">
    <g opacity="0.45">
      <rect x="14" y="98" width="62" height="42" rx="7" fill="url(#card)"/>
      <path d="M14 104 L45 124 L76 104" fill="none"/>
    </g>
    <g opacity="0.7">
      <rect x="54" y="98" width="62" height="42" rx="7" fill="url(#card)"/>
      <path d="M54 104 L85 124 L116 104" fill="none"/>
    </g>
    <rect x="94" y="98" width="62" height="42" rx="7" fill="url(#card)"/>
    <path d="M94 104 L125 124 L156 104" fill="none"/>
  </g>

  <!-- automaton -->
  <line x1="236" y1="44" x2="236" y2="22" stroke="#1e3a8a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="236" cy="18" r="9" fill="#f59e0b" stroke="#92400e" stroke-width="3"/>
  <rect x="170" y="44" width="132" height="150" rx="30" fill="url(#body)" stroke="#1e3a8a" stroke-width="5"/>
  <rect x="188" y="66" width="96" height="58" rx="16" fill="#0f172a"/>
  <circle cx="216" cy="95" r="10" fill="#5eead4"/>
  <circle cx="256" cy="95" r="10" fill="#5eead4"/>
  <rect x="160" y="108" width="22" height="22" rx="4" fill="#1e3a8a"/>
  <rect x="200" y="142" width="72" height="12" rx="6" fill="#bfdbfe"/>
  <rect x="200" y="164" width="44" height="12" rx="6" fill="#bfdbfe"/>
  <circle cx="264" cy="170" r="8" fill="#22c55e" stroke="#14532d" stroke-width="3"/>
  <path d="M260 170 L263 173 L268 166" fill="none" stroke="#f0fdf4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="160" y="228" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1e3a8a">minymaton</text>
</svg>
