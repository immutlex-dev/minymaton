[package]
name = "minymaton-server"
version.workspace = true
description = "minymaton's loopback Streamable HTTP MCP server, with the minymaton-wait helper and the minymaton-storage-check monitor"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "../../README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["command-line-utilities", "network-programming"]

[dependencies]
minymaton-core = { path = "../minymaton-core", version = "0.1.5" }
axum = "0.8"
bytes = "1"
futures = "0.3"
http = "1"
http-body-util = "0.1"
fs2 = "0.4"
humantime = "2"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rmcp = { version = "=3.1.4", features = ["server", "transport-streamable-http-server"] }
rustls-platform-verifier = "0.7"
regex = "1"
serde_json = { version = "1", features = ["raw_value", "float_roundtrip"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-util = "0.7"
url = "2"

[target.'cfg(unix)'.dependencies]
ctrlc = { version = "=3.5.2", default-features = false }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
schannel = "0.1.30"
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
getrandom = "0.3"
jsonschema = { version = "0.48", default-features = false }
reqwest = { version = "0.13", default-features = false }
rmcp = { version = "=3.1.4", features = ["client", "transport-streamable-http-client-reqwest"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }

[[bin]]
name = "minymaton-server"
path = "src/main.rs"