[project]
name = "minymaton-azure"
version = "0.1.0"
description = "Portable uv + Python + OpenTofu controller for deploying minymaton-server on Azure (Personal VSE and MCAPS)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
minymaton-azure = "minymaton_azure.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minymaton_azure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
